name: Agent Metadata

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      version:
        description: 'Version tag (needs to exactly match the GH tag for the release)'
        required: true
        type: string
      agent-type:
        description: 'Agent type'
        required: true
        type: string
      use-cache:
        description: 'Use cache'
        required: false
        default: true
        type: boolean
# commented items below pertain to future work
#      oci-registry:
#        description: 'OCI registry URL for binary uploads (e.g., ghcr.io/newrelic/agents). Leave empty to skip binary upload.'
#        required: false
#        default: ''
#        type: string
#      oci-username:
#        description: 'OCI registry username (required if oci-registry is set)'
#        required: false
#        default: ''
#        type: string
#      oci-password:
#        description: 'OCI registry password or token (required if oci-registry is set)'
#        required: false
#        default: ''
#        type: string
#      binaries:
#        description: 'JSON array with artifact definitions'
#        required: false
#        default: ''
#        type: string
    secrets:
      FC_SYS_ID_CLIENT_ID:
        required: true
      FC_SYS_ID_PR_KEY:
        required: true
      AGENT_METADATA_ACTION_LICENSE_KEY:
        required: false

jobs:
  test-agent-metadata-action:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          disable-sudo: true
          egress-policy: audit
      - name: Run action
        uses: newrelic/agent-metadata-action/send-metadata@399d5ba876e7d03bf6215f8283d72ffb8dc8240b # v1.7.0
        with:
          newrelic-client-id: ${{ secrets.FC_SYS_ID_CLIENT_ID }}
          newrelic-private-key: ${{ secrets.FC_SYS_ID_PR_KEY }}
          newrelic-license-key: ${{ secrets.AGENT_METADATA_ACTION_LICENSE_KEY }} # license key for the team that owns the action
          agent-type: ${{ inputs.agent-type }}
          version: ${{ inputs.version }}
          cache: ${{ inputs.use-cache }}
          monitoring-type: 'APM'
