name: Agent Metadata

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      version:
        description: 'Version tag (needs to exactly match the GH tag for the release)'
        required: true
        type: string
      agent-type:
        description: 'Agent type'
        required: true
        type: string
      use-cache:
        description: 'Use cache'
        required: false
        default: true
        type: boolean
      environment-name:
        description: 'GitHub environment whose secrets and protection rules the job should use. Leave empty for none.'
        required: false
        default: ''
        type: string
# commented items below pertain to future work
#      oci-registry:
#        description: 'OCI registry URL for binary uploads (e.g., ghcr.io/newrelic/agents). Leave empty to skip binary upload.'
#        required: false
#        default: ''
#        type: string
#      oci-username:
#        description: 'OCI registry username (required if oci-registry is set)'
#        required: false
#        default: ''
#        type: string
#      oci-password:
#        description: 'OCI registry password or token (required if oci-registry is set)'
#        required: false
#        default: ''
#        type: string
#      binaries:
#        description: 'JSON array with artifact definitions'
#        required: false
#        default: ''
#        type: string
    secrets:
      FC_SYS_ID_CLIENT_ID:
        required: false
      FC_SYS_ID_PR_KEY:
        required: false
      AGENT_METADATA_ACTION_LICENSE_KEY:
        required: false

jobs:
  test-agent-metadata-action:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment-name }}
    continue-on-error: true
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          disable-sudo: true
          egress-policy: audit
      - name: Run action
        uses: newrelic/agent-metadata-action/send-metadata@39a73d441e2787d13d4de26b1f437025cc34dcc7 # v1.7.1
        with:
          newrelic-client-id: ${{ secrets.FC_SYS_ID_CLIENT_ID }}
          newrelic-private-key: ${{ secrets.FC_SYS_ID_PR_KEY }}
          newrelic-license-key: ${{ secrets.AGENT_METADATA_ACTION_LICENSE_KEY }} # license key for the team that owns the action
          agent-type: ${{ inputs.agent-type }}
          version: ${{ inputs.version }}
          cache: ${{ inputs.use-cache }}
          monitoring-type: 'APM'
